name: Build Singleplayer Toolkit

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2'
          cache-provider: basic

      - name: Reject leftover template source
        shell: bash
        run: |
          set -euo pipefail
          if find src/main/java -type f \( -name '*ExampleMod.java' -o -name '*ExampleClientMod.java' \) -print -quit | grep -q .; then
            echo 'ERROR: a Fabric template example source file is still present.'
            exit 1
          fi

      - name: Build
        run: gradle clean build --no-daemon

      - name: Verify the correct toolkit jar
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          main=""
          for jar in "${jars[@]}"; do
            case "$jar" in
              *-sources.jar) ;;
              *) main="$jar"; break ;;
            esac
          done
          test -n "$main"
          test -f "$main"
          echo "Verified jar: $main"
          case "$main" in
            build/libs/spktoolkit-*.jar) ;;
            *) echo 'ERROR: unexpected output jar name.'; exit 1 ;;
          esac
          jar tf "$main" | grep -Fx 'com/example/spktoolkit/ToolkitMod.class'
          jar tf "$main" | grep -Fx 'com/example/spktoolkit/ToolkitScreen.class'
          jar tf "$main" | grep -Fx 'com/example/spktoolkit/ToolkitManager.class'
          unzip -p "$main" fabric.mod.json | grep -q '"id": "spktoolkit"'
          unzip -p "$main" fabric.mod.json | grep -q 'com.example.spktoolkit.ToolkitMod'
          if jar tf "$main" | grep -Eq '(^|/)ExampleMod\.class$|(^|/)ExampleClientMod\.class$'; then
            echo 'ERROR: a Fabric template example class is present in the output jar.'
            exit 1
          fi
          if unzip -p "$main" | strings | grep -Fq 'Hello Fabric world!'; then
            echo 'ERROR: old Fabric template example string detected in jar.'
            exit 1
          fi

      - name: Prepare the installable jar
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          main=()
          for jar in build/libs/*.jar; do
            case "$jar" in
              *-sources.jar) ;;
              *) main+=("$jar") ;;
            esac
          done
          test "${#main[@]}" -eq 1
          cp "${main[0]}" build/spktoolkit-install.jar

      - name: Upload only the installable jar
        uses: actions/upload-artifact@v4
        with:
          name: spktoolkit-jar
          path: build/spktoolkit-install.jar
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: false
